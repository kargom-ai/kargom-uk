<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kargom — compare and book cheap parcel delivery</title>
<link rel="icon" href="/assets/logo-white.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#2463DB}a:hover{color:#1A4FB8}
select,input{font-family:'Plus Jakarta Sans',sans-serif}
input:focus,select:focus{outline:none}
.fld:focus-within{border-color:#2463DB;box-shadow:inset 0 0 0 1px #2463DB}
.tab:hover{filter:brightness(1.08)}
.go:hover{background:#1A4FB8}
.play:hover .dot{transform:scale(1.06)}
</style>
<style>.kg-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1F2A3C;color:#fff;padding:12px 18px;border-radius:12px;font:600 14px 'Plus Jakarta Sans',sans-serif;z-index:60;box-shadow:0 12px 30px rgba(8,14,28,.3)}</style>
<script type="module" src="/assets/pages/home.js"></script>
<link rel="stylesheet" href="/assets/mobile.css">
</head>
<body data-page="home">
<div id="root"></div>
<script type="text/x-template" id="tpl">
<div style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1F2A3C; background: #FFFFFF; width: 100%; min-height: 100vh">

  <header style="background: #1F2A3C">
    <div style="max-width: 1080px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px">
      <a href="/" aria-label="Kargom.co.uk home"><img src="/assets/logo-white.png" alt="Kargom.co.uk" style="height: 28px; width: auto; display: block"></a>
      <nav aria-label="Main menu" class="m-topnav" style="display: flex; flex-wrap: wrap; align-items: center; gap: 22px; font-size: 14px; font-weight: 600">
        <a href="/app/send" style="color: #8FD3F7; text-decoration: none">Send a parcel</a>
        <a href="#" class="m-hide" style="color: #DCE4F2; text-decoration: none">Tracking</a>
        <a href="#" class="m-hide" style="color: #DCE4F2; text-decoration: none">Couriers</a>
        <a href="#" class="m-hide" style="color: #DCE4F2; text-decoration: none">Business</a>
        <a href="/app?view=help" class="m-hide" style="color: #DCE4F2; text-decoration: none">Help</a>
        <a href="{{nav1.href}}" style="color: #FFFFFF; background: #2463DB; text-decoration: none; padding: 10px 16px; border-radius: 8px">{{nav1.label}}</a>
        <a href="{{nav2.href}}" style="color: #DCE4F2; text-decoration: none">{{nav2.label}}</a>
      </nav>
    </div>
  </header>

  <section style="background: linear-gradient(110deg, #3D6DEB 0%, #2A4FC8 55%, #1D3593 100%); color: #FFFFFF">
    <div style="max-width: 1080px; margin: 0 auto; padding: 56px 24px 0">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px">
        <div style="flex: 999 1 460px; display: flex; flex-direction: column; gap: 30px; padding-bottom: 40px">
          <h1 style="margin: 0; font-family: 'Outfit', sans-serif; line-height: 1.1; letter-spacing: -0.015em">
            <span style="display: block; font-size: 42px; font-weight: 300">Compare and book</span>
            <span style="display: block; font-size: 48px; font-weight: 700">cheap parcel delivery</span>
          </h1>
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px 40px">
            <button type="button" class="play" onClick="{{openVideo}}" style="display: flex; align-items: center; gap: 12px; padding: 0; border: 0; background: none; color: #FFFFFF; font: 600 16px 'Plus Jakarta Sans', sans-serif; cursor: pointer; min-height: 48px">
              <span class="dot" style="width: 46px; height: 46px; border-radius: 50%; background: #FFFFFF; display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0,0,0,.2); transition: transform .15s">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#2463DB" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg>
              </span>
              Watch our video
            </button>
            <span style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; font-size: 14px; color: #DCE4F2">Send from only <b style="font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 700; color: #FFFFFF">£2.39</b> (£1.99 exc VAT)</span>
          </div>
        </div>
        <img src="/assets/cat-parcels.webp" alt="Kargom mascot, a kitten in a Kargom cap leaning on parcels addressed to Berlin, Dubai and New York" style="flex: none; width: 420px; max-width: 100%; height: auto; display: block; margin-bottom: -2px">
      </div>

      <div role="tablist" aria-label="Delivery type" class="m-modes" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="4">
          <button type="button" role="tab" class="tab" aria-selected="{{m.on}}" onClick="{{m.pick}}" style="min-height: 50px; border: 0; border-radius: {{m.radius}}; background: {{m.bg}}; color: {{m.fg}}; font: 600 17px 'Outfit', sans-serif; cursor: pointer; padding: 0 8px">{{m.label}}</button>
        </sc-for>
      </div>
    </div>
  </section>

  <section>
    <div style="max-width: 1080px; margin: 0 auto; padding: 0 24px">
      <div style="background: #FFFFFF; border: 1px solid #D8DEE8; border-top: 0; border-radius: 0 0 6px 6px; padding: 10px; box-shadow: 0 14px 30px rgba(20,35,80,.10)">
        <form style="display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch">
          <sc-for list="{{fields}}" as="f" hint-placeholder-count="3">
            <div class="fld" style="flex: {{f.flex}}; display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 10px 14px; border: 1px solid #D8DEE8; border-radius: 4px; min-height: 64px; box-sizing: border-box; min-width: 0; background: {{f.bg}}">
              <span style="font-size: 12px; color: #586579">{{f.label}}</span>
              <sc-if value="{{f.isLocked}}" hint-placeholder-val="{{ false }}">
                <span style="display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 15px; color: #1F2A3C">{{f.value}}
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A96A8" stroke-width="2.2" stroke-linecap="round" role="img" aria-label="Fixed"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
                </span>
              </sc-if>
              <sc-if value="{{f.isSelect}}" hint-placeholder-val="{{ false }}">
                <select aria-label="{{f.label}}" style="border: 0; padding: 0; font-weight: 600; font-size: 15px; color: #1F2A3C; background: transparent; margin-left: -2px">
                  <sc-for list="{{f.options}}" as="o" hint-placeholder-count="3"><option>{{o}}</option></sc-for>
                </select>
              </sc-if>
              <sc-if value="{{f.isInput}}" hint-placeholder-val="{{ true }}">
                <span style="display: flex; align-items: baseline; gap: 8px">
                  <input aria-label="{{f.label}}" placeholder="{{f.placeholder}}" inputmode="{{f.mode}}" style="flex: 1; border: 0; padding: 0; font-weight: 600; font-size: 15px; color: #1F2A3C; min-width: 0; background: transparent">
                  <span style="font-size: 13px; color: #586579">{{f.unit}}</span>
                </span>
              </sc-if>
              <sc-if value="{{f.isRadio}}" hint-placeholder-val="{{ false }}">
                <span style="display: flex; gap: 16px; font-size: 14px">
                  <label style="display: flex; align-items: center; gap: 6px; cursor: pointer"><input type="radio" name="dims" checked="{{laterOn}}" onChange="{{dimsLater}}" style="width: 16px; height: 16px; margin: 0; accent-color: #2463DB">Later</label>
                  <label style="display: flex; align-items: center; gap: 6px; cursor: pointer"><input type="radio" name="dims" checked="{{nowOn}}" onChange="{{dimsNow}}" style="width: 16px; height: 16px; margin: 0; accent-color: #2463DB">Now</label>
                </span>
              </sc-if>
            </div>
          </sc-for>
          <a href="{{cta.href}}" onClick="{{cta.go}}" class="go" style="flex: 1 1 180px; display: flex; align-items: center; justify-content: center; min-height: 64px; border-radius: 4px; background: #2463DB; color: #FFFFFF; font: 600 19px 'Outfit', sans-serif; text-decoration: none; padding: 0 18px">{{cta.label}}</a>
        </form>
        <sc-if value="{{showDims}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px">
            <label class="fld" style="flex: 1 1 120px; display: flex; flex-direction: column; gap: 5px; padding: 10px 14px; border: 1px solid #D8DEE8; border-radius: 4px; font-size: 12px; color: #586579">Length (cm)<input aria-label="Length (cm)" inputmode="decimal" placeholder="e.g. 30" style="border: 0; padding: 0; font-weight: 600; font-size: 15px; color: #1F2A3C"></label>
            <label class="fld" style="flex: 1 1 120px; display: flex; flex-direction: column; gap: 5px; padding: 10px 14px; border: 1px solid #D8DEE8; border-radius: 4px; font-size: 12px; color: #586579">Width (cm)<input aria-label="Width (cm)" inputmode="decimal" placeholder="e.g. 20" style="border: 0; padding: 0; font-weight: 600; font-size: 15px; color: #1F2A3C"></label>
            <label class="fld" style="flex: 1 1 120px; display: flex; flex-direction: column; gap: 5px; padding: 10px 14px; border: 1px solid #D8DEE8; border-radius: 4px; font-size: 12px; color: #586579">Height (cm)<input aria-label="Height (cm)" inputmode="decimal" placeholder="e.g. 15" style="border: 0; padding: 0; font-weight: 600; font-size: 15px; color: #1F2A3C"></label>
            <label class="fld" style="flex: 1 1 120px; display: flex; flex-direction: column; gap: 5px; padding: 10px 14px; border: 1px solid #D8DEE8; border-radius: 4px; font-size: 12px; color: #586579">Parcels<input inputmode="numeric" value="1" style="border: 0; padding: 0; font-weight: 600; font-size: 15px; color: #1F2A3C"></label>
          </div>
        </sc-if>
      </div>
      <div style="display: flex; flex-wrap: wrap; margin-top: 14px; font-size: 14px">
        <sc-for list="{{links}}" as="k" hint-placeholder-count="3">
          <a href="#" style="color: #3E4A5C; text-decoration: none; padding: 2px 12px 2px 0; margin-right: 12px; border-right: 1px solid #D8DEE8">{{k}}</a>
        </sc-for>
      </div>
    </div>
  </section>

  <section style="max-width: 1080px; margin: 0 auto; padding: 72px 24px 32px; display: flex; flex-direction: column; align-items: center; gap: 32px">
    <h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 30px; font-weight: 400; text-align: center">Send your parcel with trusted UK couriers</h2>
    <div style="width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px">
      <sc-for list="{{couriers}}" as="c" hint-placeholder-count="9">

          <sc-if value="{{c.hasLogo}}" hint-placeholder-val="{{ true }}">
            <img src="{{c.logo}}" alt="{{c.name}}" style="max-height: 46px; max-width: 80%; object-fit: contain">
          </sc-if>
          <sc-if value="{{c.noLogo}}" hint-placeholder-val="{{ false }}">
            <b style="font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 700">{{c.name}}</b>
          </sc-if>
          <span style="font-size: 12px; color: #586579">{{c.note}}</span>
        </a>
      </sc-for>
    </div>
    <a href="#" style="font-weight: 600; font-size: 15px; color: #1F2A3C">Browse all couriers</a>
  </section>

</svg>
      </div>
      <span style="font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; color: #2463DB">Step 1</span>
      <h3 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 600">Compare quotes</h3>
      <p style="margin: 0; color: #3E4A5C; line-height: 1.6">Enter the weight, see every courier and service side by side, sorted by price or speed.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="height: 220px; border-radius: 14px; background: #EAF2FE; overflow: hidden; display: grid; place-items: center">
