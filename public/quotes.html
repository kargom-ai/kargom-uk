<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your quotes — Kargom</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icon-96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="manifest" href="/assets/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#F4F6FA}
a{color:#2463DB}a:hover{color:#1A4FB8}
.card:hover{border-color:#9FB4D3}
.book:hover{background:#1A4FB8}
.ld{background:#FFFFFF;border:1px solid #DCE2EB;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px}
.ld-top{display:flex;align-items:center;gap:14px}
.ld-top b{display:block;font:600 19px 'Nunito Sans',sans-serif}
.ld-top span{font-size:14px;color:#586579}
.ld-spin{flex:none;width:34px;height:34px;border-radius:50%;border:4px solid #DCE8FD;border-top-color:#2463DB;animation:ldspin .8s linear infinite}
.ld-bar{height:6px;border-radius:3px;background:#EEF2F7;overflow:hidden}
.ld-bar span{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,#33AEEF,#2463DB);animation:ldbar 1.4s ease-in-out infinite}
.ld-logos{display:flex;flex-wrap:wrap;gap:10px}
.ld-logos img{width:58px;height:34px;object-fit:contain;padding:6px;border-radius:8px;background:#F4F6FA;animation:ldpulse 1.6s ease-in-out infinite}
.sk{background:#FFFFFF;border:1px solid #DCE2EB;border-radius:8px;padding:18px 20px;display:flex;align-items:center;gap:18px}
.sk i{display:block;border-radius:6px;background:linear-gradient(90deg,#EEF2F7 25%,#F7F9FC 50%,#EEF2F7 75%);background-size:200% 100%;animation:ldshine 1.2s linear infinite}
@keyframes ldspin{to{transform:rotate(360deg)}}
@keyframes ldbar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes ldpulse{0%,100%{opacity:.35;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
@keyframes ldshine{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.ld-spin,.ld-bar span,.ld-logos img,.sk i{animation:none}}
</style>
<style>.kg-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1F2A3C;color:#fff;padding:12px 18px;border-radius:12px;font:600 14px 'Nunito Sans',sans-serif;z-index:60;box-shadow:0 12px 30px rgba(8,14,28,.3)}</style>
<script type="module" src="/assets/pages/quotes.js"></script>
<link rel="stylesheet" href="/assets/mobile.css">
</head>
<body data-page="quotes">
<div id="root"></div>
<script type="text/x-template" id="tpl">
<div style="font-family: 'Nunito Sans', system-ui, sans-serif; color: #1F2A3C; background: #F4F6FA; width: 100%; min-height: 100vh">

  <header style="background: #1F2A3C">
    <div style="max-width: 1180px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px">
      <a href="/" aria-label="Kargom.co.uk home"><img src="/assets/logo-white.png" alt="Kargom.co.uk" style="height: 26px; width: auto; display: block"></a>
      <div style="flex: 999 1 480px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; background: #2C3A50; border-radius: 8px; padding: 6px; min-width: 0">
        <span style="padding: 8px 12px; color: #FFFFFF; font-weight: 600; font-size: 15px">{{route}}</span>
        <span style="padding: 8px 12px; color: #C9D4E5; font-size: 14px; border-left: 1px solid #44536B">{{parcelTxt}}</span>
        <a href="/" style="margin-left: auto; display: flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 6px; background: #FFFFFF; color: #1F2A3C; font-weight: 700; font-size: 14px; text-decoration: none">Edit search</a>
      </div>
    </div>
  </header>

  <main style="max-width: 1180px; margin: 0 auto; padding: 24px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
    <aside aria-label="Filters" class="m-filters" data-open="{{filtersOpen}}" style="flex: 1 1 250px; max-width: 290px; display: flex; flex-direction: column; gap: 12px">
      <div style="background: #FFFFFF; border: 1px solid #DCE2EB; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 8px">
        <b style="font-size: 15px">How it starts its journey</b>
        <sc-for list="{{typeFilters}}" as="t" hint-placeholder-count="3">
          <label style="display: flex; align-items: center; gap: 10px; min-height: 34px; font-size: 14px; cursor: pointer">
            <input type="checkbox" checked="{{t.on}}" onChange="{{t.toggle}}" style="width: 18px; height: 18px; accent-color: #2463DB">
            <span style="flex: 1">{{t.label}}</span><span style="color: #586579; font-variant-numeric: tabular-nums">{{t.min}}</span>
          </label>
        </sc-for>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #DCE2EB; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 8px">
        <b style="font-size: 15px">Delivery speed</b>
        <sc-for list="{{speedFilters}}" as="s" hint-placeholder-count="3">
          <label style="display: flex; align-items: center; gap: 10px; min-height: 34px; font-size: 14px; cursor: pointer">
            <input type="radio" name="speed" checked="{{s.on}}" onChange="{{s.pick}}" style="width: 18px; height: 18px; accent-color: #2463DB">{{s.label}}
          </label>
        </sc-for>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #DCE2EB; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 8px">
        <b style="font-size: 15px">Couriers</b>
        <sc-for list="{{courierFilters}}" as="c" hint-placeholder-count="8">
          <label style="display: flex; align-items: center; gap: 10px; min-height: 34px; font-size: 14px; cursor: pointer">
            <input type="checkbox" checked="{{c.on}}" onChange="{{c.toggle}}" style="width: 18px; height: 18px; accent-color: #2463DB">{{c.name}}
          </label>
        </sc-for>
      </div>
      <button type="button" class="m-only m-filterdone" onClick="{{toggleFilters}}">Show {{count}} results</button>
    </aside>

    <section style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
        <h1 style="margin: 0; font-family: 'Nunito Sans', sans-serif; font-size: 26px">{{headTxt}}</h1>
        <span style="font-size: 13px; color: #586579">Live prices · all prices include VAT</span>
        <button type="button" class="m-only m-filterbtn" onClick="{{toggleFilters}}" aria-expanded="{{filtersOpen}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>Filter</button>
      </div>

      <sc-if value="{{loading}}">
        <div class="ld" role="status" aria-live="polite">
          <div class="ld-top"><span class="ld-spin" aria-hidden="true"></span><div><b>{{loadTitle}}</b><span>{{loadTxt}}</span></div></div>
          <div class="ld-bar" aria-hidden="true"><span></span></div>
          <div class="ld-logos" aria-hidden="true"><img src="/assets/carriers/royalmail.png" alt="" style="animation-delay: 0.00s"><img src="/assets/carriers/evri.png" alt="" style="animation-delay: 0.18s"><img src="/assets/carriers/dpd.png" alt="" style="animation-delay: 0.36s"><img src="/assets/carriers/inpost.png" alt="" style="animation-delay: 0.54s"><img src="/assets/carriers/yodel.png" alt="" style="animation-delay: 0.72s"><img src="/assets/carriers/parcelforce.png" alt="" style="animation-delay: 0.90s"><img src="/assets/carriers/ups.png" alt="" style="animation-delay: 1.08s"><img src="/assets/carriers/dhl.png" alt="" style="animation-delay: 1.26s"></div>
        </div>
        <div class="sk" aria-hidden="true"><i style="width: 64px; height: 40px"></i><span style="flex: 1; display: flex; flex-direction: column; gap: 8px"><i style="width: 55%; height: 14px"></i><i style="width: 35%; height: 12px"></i></span><i style="width: 70px; height: 40px"></i></div>
        <div class="sk" aria-hidden="true"><i style="width: 64px; height: 40px"></i><span style="flex: 1; display: flex; flex-direction: column; gap: 8px"><i style="width: 45%; height: 14px"></i><i style="width: 30%; height: 12px"></i></span><i style="width: 70px; height: 40px"></i></div>
        <div class="sk" aria-hidden="true"><i style="width: 64px; height: 40px"></i><span style="flex: 1; display: flex; flex-direction: column; gap: 8px"><i style="width: 50%; height: 14px"></i><i style="width: 40%; height: 12px"></i></span><i style="width: 70px; height: 40px"></i></div>
      </sc-if>
      <sc-if value="{{loaded}}">
      <div role="tablist" aria-label="Sort" class="m-sort" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #FFFFFF; border: 1px solid #DCE2EB; border-radius: 8px; overflow: hidden">
        <sc-for list="{{sorts}}" as="s" hint-placeholder-count="3">
          <button type="button" role="tab" aria-selected="{{s.on}}" onClick="{{s.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 16px; border: 0; border-bottom: 3px solid {{s.bar}}; background: {{s.bg}}; cursor: pointer; text-align: left; font-family: 'Nunito Sans', sans-serif; min-height: 70px">
            <span style="font-size: 14px; font-weight: 700; color: #1F2A3C">{{s.label}}</span>
            <span style="font-family: 'Nunito Sans', sans-serif; font-size: 20px; font-weight: 700; color: #1F2A3C; font-variant-numeric: tabular-nums">{{s.price}}</span>
            <span style="font-size: 12px; color: #586579">{{s.sub}}</span>
          </button>
        </sc-for>
      </div>
      </sc-if>

      <sc-for list="{{results}}" as="r" hint-placeholder-count="6">
        <article class="card" style="background: #FFFFFF; border: 1px solid #DCE2EB; border-radius: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; padding: 16px 18px">
          <div style="width: 110px; height: 54px; flex: none; display: grid; place-items: center; background: #F4F6FA; border-radius: 6px">
            <sc-if value="{{r.hasLogo}}" hint-placeholder-val="{{ true }}"><img src="{{r.logo}}" alt="{{r.courier}}" style="max-height: 40px; max-width: 92px; object-fit: contain"></sc-if>
            <sc-if value="{{r.noLogo}}" hint-placeholder-val="{{ false }}"><b style="font-family: 'Nunito Sans', sans-serif; font-size: 17px">{{r.courier}}</b></sc-if>
          </div>
          <div style="flex: 999 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
              <b style="font-size: 16px">{{r.service}}</b>
              <sc-if value="{{r.hasBadge}}" hint-placeholder-val="{{ false }}">
                <span style="font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: #E6F4EA; color: #166534">{{r.badge}}</span>
              </sc-if>
            </div>
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px">
              <sc-if value="{{r.instant}}" hint-placeholder-val="{{ true }}"><span style="display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: #E6F4EA; color: #166534"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>Instant label</span><span style="font-size: 12px; color: #586579">Print it straight after payment</span></sc-if>
              <sc-if value="{{r.later}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: #FFF4E0; color: #9A5B00"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Label within 1 hour</span><span style="font-size: 12px; color: #586579">{{r.laterTxt}}</span></sc-if>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: #3E4A5C">
              <span>{{r.typeLabel}}</span>
              <span>{{r.eta}}</span>
              <span>{{r.cover}}</span>
              <sc-if value="{{r.tracked}}" hint-placeholder-val="{{ true }}"><span>Tracked</span></sc-if>
            </div>
          </div>
          <div style="flex: 1 1 170px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right">
            <span style="font-family: 'Nunito Sans', sans-serif; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums">{{r.price}}</span>
            <span style="font-size: 12px; color: #586579">{{r.exVat}} ex VAT</span>
            <a href="#" onClick="{{r.book}}" class="book" style="margin-top: 6px; display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 26px; border-radius: 4px; background: #2463DB; color: #FFFFFF; font-weight: 700; text-decoration: none">Book</a>
          </div>
        </article>
      </sc-for>

      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
        <div style="background: #FFFFFF; border: 1px dashed #C9D6EA; border-radius: 8px; padding: 32px; text-align: center; color: #3E4A5C">{{emptyTxt}}</div>
      </sc-if>
    </section>
  </main>
</div>
</script>
</body>
</html>
