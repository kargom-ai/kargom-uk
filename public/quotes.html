<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your quotes — Kargom</title>
<link rel="icon" href="/assets/logo-white.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F4F6FA}
a{color:#2463DB}a:hover{color:#1A4FB8}
.card:hover{border-color:#9FB4D3}
.book:hover{background:#1A4FB8}
</style>
<style>.kg-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1F2A3C;color:#fff;padding:12px 18px;border-radius:12px;font:600 14px 'Plus Jakarta Sans',sans-serif;z-index:60;box-shadow:0 12px 30px rgba(8,14,28,.3)}</style>
<script type="module" src="/assets/pages/quotes.js"></script>
<link rel="stylesheet" href="/assets/mobile.css">
</head>
<body data-page="quotes">
<div id="root"></div>
<script type="text/x-template" id="tpl">
<div style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1F2A3C; background: #F4F6FA; width: 100%; min-height: 100vh">

  <header style="background: #1F2A3C">
    <div style="max-width: 1180px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px">
      <a href="/" aria-label="Kargom.co.uk home"><img src="/assets/logo-white.png" alt="Kargom.co.uk" style="height: 26px; width: auto; display: block"></a>
      <div style="flex: 999 1 480px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; background: #2C3A50; border-radius: 8px; padding: 6px; min-width: 0">
        <span style="padding: 8px 12px; color: #FFFFFF; font-weight: 600; font-size: 15px">{{route}}</span>
        <span style="padding: 8px 12px; color: #C9D4E5; font-size: 14px; border-left: 1px solid #44536B">{{parcelTxt}}</span>
        <a href="/" style="margin-left: auto; display: flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 6px; background: #FFFFFF; color: #1F2A3C; font-weight: 700; font-size: 14px; text-decoration: none">Edit search</a>
      </div>
    </div>
  </header>

  <main style="max-width: 1180px; margin: 0 auto; padding: 24px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
    <button type="button" class="m-only m-filterbtn" onClick="{{toggleFilters}}" aria-expanded="{{filtersOpen}}">{{filterBtn}}</button>
    <aside aria-label="Filters" class="m-filters" data-open="{{filtersOpen}}" style="flex: 1 1 250px; max-width: 290px; display: flex; flex-direction: column; gap: 12px">
      <div style="background: #FFFFFF; border: 1px solid #DCE2EB; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 8px">
        <b style="font-size: 15px">How it starts its journey</b>
        <sc-for list="{{typeFilters}}" as="t" hint-placeholder-count="3">
          <label style="display: flex; align-items: center; gap: 10px; min-height: 34px; font-size: 14px; cursor: pointer">
            <input type="checkbox" checked="{{t.on}}" onChange="{{t.toggle}}" style="width: 18px; height: 18px; accent-color: #2463DB">
            <span style="flex: 1">{{t.label}}</span><span style="color: #586579; font-variant-numeric: tabular-nums">{{t.min}}</span>
          </label>
        </sc-for>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #DCE2EB; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 8px">
        <b style="font-size: 15px">Delivery speed</b>
        <sc-for list="{{speedFilters}}" as="s" hint-placeholder-count="3">
          <label style="display: flex; align-items: center; gap: 10px; min-height: 34px; font-size: 14px; cursor: pointer">
            <input type="radio" name="speed" checked="{{s.on}}" onChange="{{s.pick}}" style="width: 18px; height: 18px; accent-color: #2463DB">{{s.label}}
          </label>
        </sc-for>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #DCE2EB; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 8px">
        <b style="font-size: 15px">Couriers</b>
        <sc-for list="{{courierFilters}}" as="c" hint-placeholder-count="8">
          <label style="display: flex; align-items: center; gap: 10px; min-height: 34px; font-size: 14px; cursor: pointer">
            <input type="checkbox" checked="{{c.on}}" onChange="{{c.toggle}}" style="width: 18px; height: 18px; accent-color: #2463DB">{{c.name}}
          </label>
        </sc-for>
      </div>
    </aside>

    <section style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
        <h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 26px">{{count}} delivery services</h1>
        <span style="font-size: 13px; color: #586579">Sample prices · all prices include VAT</span>
      </div>

      <div role="tablist" aria-label="Sort" class="m-sort" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #FFFFFF; border: 1px solid #DCE2EB; border-radius: 8px; overflow: hidden">
        <sc-for list="{{sorts}}" as="s" hint-placeholder-count="3">
          <button type="button" role="tab" aria-selected="{{s.on}}" onClick="{{s.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 16px; border: 0; border-bottom: 3px solid {{s.bar}}; background: {{s.bg}}; cursor: pointer; text-align: left; font-family: 'Plus Jakarta Sans', sans-serif; min-height: 70px">
            <span style="font-size: 14px; font-weight: 700; color: #1F2A3C">{{s.label}}</span>
            <span style="font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 700; color: #1F2A3C; font-variant-numeric: tabular-nums">{{s.price}}</span>
            <span style="font-size: 12px; color: #586579">{{s.sub}}</span>
          </button>
        </sc-for>
      </div>

      <sc-for list="{{results}}" as="r" hint-placeholder-count="6">
        <article class="card" style="background: #FFFFFF; border: 1px solid #DCE2EB; border-radius: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; padding: 16px 18px">
          <div style="width: 110px; height: 54px; flex: none; display: grid; place-items: center; background: #F4F6FA; border-radius: 6px">
            <sc-if value="{{r.hasLogo}}" hint-placeholder-val="{{ true }}"><img src="{{r.logo}}" alt="{{r.courier}}" style="max-height: 40px; max-width: 92px; object-fit: contain"></sc-if>
            <sc-if value="{{r.noLogo}}" hint-placeholder-val="{{ false }}"><b style="font-family: 'Outfit', sans-serif; font-size: 17px">{{r.courier}}</b></sc-if>
          </div>
          <div style="flex: 999 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
              <b style="font-size: 16px">{{r.service}}</b>
              <sc-if value="{{r.hasBadge}}" hint-placeholder-val="{{ false }}">
                <span style="font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: #E6F4EA; color: #166534">{{r.badge}}</span>
              </sc-if>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: #3E4A5C">
              <span>{{r.typeLabel}}</span>
              <span>{{r.eta}}</span>
              <span>{{r.cover}}</span>
              <sc-if value="{{r.tracked}}" hint-placeholder-val="{{ true }}"><span>Tracked</span></sc-if>
            </div>
          </div>
          <div style="flex: 1 1 170px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right">
            <span style="font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums">{{r.price}}</span>
            <span style="font-size: 12px; color: #586579">{{r.exVat}} ex VAT</span>
            <a href="#" onClick="{{r.book}}" class="book" style="margin-top: 6px; display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 26px; border-radius: 4px; background: #2463DB; color: #FFFFFF; font-weight: 700; text-decoration: none">Book</a>
          </div>
        </article>
      </sc-for>

      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
        <div style="background: #FFFFFF; border: 1px dashed #C9D6EA; border-radius: 8px; padding: 32px; text-align: center; color: #3E4A5C">{{emptyTxt}}</div>
      </sc-if>
    </section>
  </main>
</div>
</script>
</body>
</html>
