<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Your label — Kargom.co.uk</title>
<link rel="icon" href="/assets/logo-white.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="/assets/flow.css">
<script type="module" src="/assets/pages/label.js"></script>
<link rel="stylesheet" href="/assets/mobile.css">
</head>
<body data-page="label">
<div id="root"></div>
<script type="text/x-template" id="tpl">
<div class="page">
  <header class="top">
    <div class="top-in">
      <a href="/" aria-label="Kargom.co.uk home"><img src="/assets/logo-white.png" alt="Kargom.co.uk" class="logo"></a>
      <a href="/" class="toplink">Send another parcel</a>
    </div>
  </header>
  <main class="wrap">
    <sc-if value="{{loading}}">
      <section class="card center"><span class="spin"></span><h1 style="font-size: 24px">{{waitTitle}}</h1><p class="muted" style="margin: 0">{{waitTxt}}</p></section>
    </sc-if>
    <sc-if value="{{failed}}">
      <section class="card center"><h1 style="font-size: 24px">{{failTitle}}</h1><p class="muted" style="margin: 0; max-width: 460px">{{failTxt}}</p><a class="btn big" href="/">Back to prices</a></section>
    </sc-if>
    <sc-if value="{{ready}}">
      <div class="label-cols">
        <div class="label-main">
          <section class="hero">
            <span class="tag">BOOKED AND PAID</span>
            <h1>Your label is ready</h1>
            <p>{{doneLine}}</p>
            <div class="refs"><span>Tracking <b>{{tracking}}</b></span><span>Reference <b>{{ref}}</b></span><span>Paid <b>{{priceTxt}}</b></span></div>
          </section>
          <div class="actions">
            <a class="btn big" href="{{pdfUrl}}" target="_blank" rel="noopener">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2"></path><rect x="6" y="14" width="12" height="7"></rect></svg>Print label</a>
            <a class="btn big ghost" href="{{downloadUrl}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>Download</a>
            <a class="btn big wa" href="{{waUrl}}" target="_blank" rel="noopener">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"></path></svg>WhatsApp</a>
            <button type="button" class="btn big ghost" onClick="{{copyLink}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"></path></svg>{{copyTxt}}</button>
          </div>
          <span class="warn">Keep this page: it is your receipt. Bookmark it or send it to yourself on WhatsApp. Anyone with this link can see and print the label, so share it only with people you trust.</span>
          <section class="preview">
            <iframe src="{{pdfUrl}}" title="Shipping label preview"></iframe>
          </section>
        </div>
        <aside class="label-side">
          <section class="card" style="display: flex; flex-direction: column; gap: 14px">
            <h2 style="font-size: 19px; font-weight: 600">What to do now</h2>
            <ol class="steps-list">
              <li><span>1</span><span>Print the label (A4 or a label printer) and fold the page so the barcode is flat.</span></li>
              <li><span>2</span><span>Tape it to the biggest side of the parcel. Cover old labels and barcodes.</span></li>
              <li><span>3</span><span>{{handover}}</span></li>
            </ol>
            <span class="warn">No printer? Most {{carrierName}} shops can print it from this page or the PDF on your phone.</span>
          </section>
          <section class="card" style="display: flex; flex-direction: column; gap: 12px">
            <h2 style="font-size: 19px; font-weight: 600">Shipment</h2>
            <div class="addr"><div><b>From</b>{{fromTxt}}</div><div><b>To</b>{{toTxt}}</div></div>
            <div class="kv"><span class="muted">Service</span><b>{{service}}</b></div>
            <div class="kv"><span class="muted">Parcel</span><b>{{parcelTxt}}</b></div>
            <a class="btn ghost" href="{{trackUrl}}" target="_blank" rel="noopener">Track this parcel</a>
          </section>
          <section class="card" style="display: flex; flex-direction: column; gap: 10px; background: #F5F9FF; border-color: #D6E4FB">
            <h2 style="font-size: 18px; font-weight: 600">Save time next time</h2>
            <span class="muted" style="font-size: 14px; line-height: 1.5">A free account keeps your addresses, labels and tracking in one place, and a wallet makes booking one click.</span>
            <a class="btn" href="{{registerUrl}}">Create a free account</a>
          </section>
        </aside>
      </div>
    </sc-if>
  </main>
  <sc-if value="{{toast}}"><div class="kg-toast" role="status">{{toastTxt}}</div></sc-if>
</div>
</script>
</body>
</html>
