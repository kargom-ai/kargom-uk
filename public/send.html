<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send a parcel — Kargom</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icon-96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="manifest" href="/assets/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F4F6FA}
a{color:#2463DB}a:hover{color:#1A4FB8}
.nav:hover{background:#EEF3FB}
.opt:hover{border-color:#2463DB}
.btn:hover{filter:brightness(1.06)}
.ghost:hover{background:#F4F6FA}
.qty:hover{background:#EAF2FE}
select:focus,input:focus{outline:2px solid #33AEEF;outline-offset:-2px}
</style>
<style>.ld{background:#FFFFFF;border:1px solid #DCE2EB;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px}
.ld-top{display:flex;align-items:center;gap:14px}
.ld-top b{display:block;font:600 19px 'Outfit',sans-serif}
.ld-top span{font-size:14px;color:#586579}
.ld-spin{flex:none;width:34px;height:34px;border-radius:50%;border:4px solid #DCE8FD;border-top-color:#2463DB;animation:ldspin .8s linear infinite}
.ld-bar{height:6px;border-radius:3px;background:#EEF2F7;overflow:hidden}
.ld-bar span{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,#33AEEF,#2463DB);animation:ldbar 1.4s ease-in-out infinite}
.ld-logos{display:flex;flex-wrap:wrap;gap:10px}
.ld-logos img{width:58px;height:34px;object-fit:contain;padding:6px;border-radius:8px;background:#F4F6FA;animation:ldpulse 1.6s ease-in-out infinite}
.sk{background:#FFFFFF;border:1px solid #DCE2EB;border-radius:8px;padding:18px 20px;display:flex;align-items:center;gap:18px}
.sk i{display:block;border-radius:6px;background:linear-gradient(90deg,#EEF2F7 25%,#F7F9FC 50%,#EEF2F7 75%);background-size:200% 100%;animation:ldshine 1.2s linear infinite}
@keyframes ldspin{to{transform:rotate(360deg)}}
@keyframes ldbar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes ldpulse{0%,100%{opacity:.35;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
@keyframes ldshine{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.ld-spin,.ld-bar span,.ld-logos img,.sk i{animation:none}}
</style>
<style>.kg-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1F2A3C;color:#fff;padding:12px 18px;border-radius:12px;font:600 14px 'Plus Jakarta Sans',sans-serif;z-index:60;box-shadow:0 12px 30px rgba(8,14,28,.3)}</style>
<script type="module" src="/assets/pages/send.js"></script>
<link rel="stylesheet" href="/assets/mobile.css">
</head>
<body data-page="send">
<div id="root"></div>
<script type="text/x-template" id="tpl">
<div style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1F2A3C; background: #F4F6FA; width: 100%; min-height: 100vh; display: flex; flex-direction: column">

  <header class="m-apphead" style="background: #1F2A3C; color: #FFFFFF">
    <div style="padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px">
      <a href="/" aria-label="Kargom.co.uk home"><img src="/assets/logo-white.png" alt="Kargom.co.uk" style="height: 28px; width: auto; display: block"></a>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 14px">
        <button type="button" class="m-hide" aria-label="Notifications" style="position: relative; width: 42px; height: 42px; border-radius: 10px; border: 0; background: transparent; color: #DCE4F2; display: grid; place-items: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg>
          <span style="position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: #E5484D; box-shadow: 0 0 0 2px #1F2A3C"></span>
        </button>
        <a href="/app" aria-label="Wallet balance {{balTxt}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px 0 6px; border-radius: 12px; border: 1px solid #3B4A63; background: #26334A; color: #FFFFFF; font: 700 15px 'Outfit', sans-serif; text-decoration: none">
          <span style="width: 32px; height: 32px; border-radius: 8px; background: #2463DB; display: grid; place-items: center">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"></rect><path d="M3 10h18M16 15h2"></path></svg>
          </span>
          <span style="font-variant-numeric: tabular-nums">{{balTxt}}</span>
        </a>
        <span style="display: flex; align-items: center; gap: 10px">
          <span style="width: 38px; height: 38px; border-radius: 50%; background: #FFFFFF; color: #1F2A3C; display: grid; place-items: center; font: 700 14px 'Outfit', sans-serif">{{meIni}}</span>
          <span class="m-hide" style="display: flex; flex-direction: column; line-height: 1.25"><b style="font-size: 14px">{{meName}}</b><span style="font-size: 12px; color: #9FB0C8">{{meType}}</span></span>
          <button type="button" class="m-hide" onClick="{{signOut}}" style="margin-left: 6px; min-height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid #3B4A63; background: transparent; color: #DCE4F2; font: 700 13px 'Plus Jakarta Sans', sans-serif; cursor: pointer">Sign out</button>
        </span>
      </div>
    </div>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap; align-items: stretch">
    <aside aria-label="Account menu" class="m-side" style="flex: 1 1 230px; max-width: 250px; background: #FFFFFF; border-right: 1px solid #E1E7EF; padding: 20px 14px; display: flex; flex-direction: column; gap: 6px; box-sizing: border-box">
      <a href="/app/send" aria-current="page" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; border-radius: 11px; background: #2463DB; color: #FFFFFF; font-weight: 700; text-decoration: none; box-shadow: 0 0 0 3px #BFD6FB">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Send a parcel
      </a>
      <a href="/app/quote" class="m-quote" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 11px; border: 1px solid #C9D6EA; background: #FFFFFF; color: #1F2A3C; font-weight: 700; font-size: 14px; text-decoration: none; margin-top: 4px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"></path><circle cx="7" cy="17.5" r="1.8"></circle><circle cx="17" cy="17.5" r="1.8"></circle></svg>Get a quote
      </a>
      <span style="height: 12px"></span>
      <nav style="display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{nav}}" as="n" hint-placeholder-count="8">
          <a href="{{n.href}}" class="nav" style="display: flex; align-items: center; gap: 11px; min-height: 42px; padding: 0 12px; border-radius: 10px; color: #3E4A5C; font: 600 14px 'Plus Jakarta Sans', sans-serif; text-decoration: none">
            <span style="width: 8px; height: 8px; border-radius: 50%; background: #C9D6EA"></span>{{n.label}}
          </a>
        </sc-for>
      </nav>
      <button type="button" class="m-signout" onClick="{{signOut}}" style="margin-top: 10px; display: flex; align-items: center; min-height: 42px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: #B42318; font: 600 14px 'Plus Jakarta Sans', sans-serif; cursor: pointer; text-align: left">Sign out</button>
    </aside>

    <main class="m-main" style="flex: 999 1 640px; min-width: 0; padding: 28px 28px 0; display: flex; flex-direction: column; gap: 22px; box-sizing: border-box">
      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px">
        <div>
          <h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 32px; font-weight: 600; letter-spacing: -0.015em">Send a parcel</h1>
          <span style="font-size: 14px; color: #586579">Five quick steps. Saved parcels and addresses make the next one even faster.</span>
        </div>
        <div role="radiogroup" aria-label="Shipment type" style="display: flex; padding: 4px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E1E7EF">
          <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
            <button type="button" role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="min-height: 40px; padding: 0 18px; border-radius: 9px; border: 0; background: {{m.bg}}; color: {{m.fg}}; font: 700 14px 'Plus Jakarta Sans', sans-serif; cursor: pointer">{{m.label}}</button>
          </sc-for>
        </div>
      </div>

      <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
        <section style="background: #FFFFFF; border: 1px solid #E1E7EF; border-radius: 18px; padding: 32px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center">
          <svg width="220" height="170" viewBox="0 0 220 170" aria-hidden="true" style="flex: none">
            <circle cx="110" cy="85" r="78" fill="#EAF2FE"></circle>
            <rect x="58" y="22" width="104" height="128" rx="6" fill="#FFFFFF" stroke="#C9D6EA" stroke-width="2"></rect>
            <rect x="70" y="34" width="50" height="8" rx="4" fill="#2463DB"></rect><rect x="70" y="48" width="34" height="6" rx="3" fill="#9FB0C8"></rect>
            <rect x="70" y="64" width="34" height="34" fill="#1F2A3C"></rect>
            <g fill="#FFFFFF"><rect x="74" y="68" width="9" height="9"></rect><rect x="91" y="68" width="9" height="9"></rect><rect x="74" y="85" width="9" height="9"></rect><rect x="86" y="81" width="5" height="5"></rect><rect x="93" y="89" width="6" height="6"></rect></g>
            <g fill="#1F2A3C"><rect x="112" y="64" width="3" height="34"></rect><rect x="118" y="64" width="2" height="34"></rect><rect x="123" y="64" width="4" height="34"></rect><rect x="130" y="64" width="2" height="34"></rect><rect x="135" y="64" width="3" height="34"></rect><rect x="141" y="64" width="4" height="34"></rect></g>
            <rect x="70" y="110" width="76" height="6" rx="3" fill="#C9D6EA"></rect><rect x="70" y="122" width="54" height="6" rx="3" fill="#C9D6EA"></rect>
            <circle cx="160" cy="132" r="24" fill="#16A34A"></circle><path d="M149 132l7 7 14-15" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 10px">
            <span style="font-size: 13px; font-weight: 700; color: #166534; text-transform: uppercase; letter-spacing: .05em">Booked and paid</span>
            <h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 30px; font-weight: 600">Your label is ready</h2>
            <span style="font-size: 15px; color: #3E4A5C; line-height: 1.6">{{doneLine}}</span>
            <span style="display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; color: #3E4A5C">
              <span>Tracking no <b style="font-family: ui-monospace, Menlo, monospace; color: #1F2A3C">{{doneRef}}</b> · {{doneTracking}}</span>
              <span>{{paidLabel}} <b style="color: #1F2A3C">{{priceTxt}}</b></span>
              <span>New balance <b style="color: #1F2A3C">{{balTxt}}</b></span>
            </span>
            <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px">
              <a href="{{labelUrl}}" target="_blank" rel="noopener" class="btn" style="display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 11px; background: #2463DB; color: #FFFFFF; font-weight: 700; text-decoration: none">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"></path></svg>Download label (PDF)
              </a>
              <a href="{{trackUrl}}" target="_blank" rel="noopener" class="ghost" style="display: inline-flex; align-items: center; min-height: 46px; padding: 0 18px; border-radius: 11px; border: 1px solid #C9D6EA; color: #1F2A3C; font-weight: 700; text-decoration: none">Track parcel</a>
              <a href="/app" class="ghost" style="display: inline-flex; align-items: center; min-height: 46px; padding: 0 18px; border-radius: 11px; border: 1px solid #C9D6EA; color: #1F2A3C; font-weight: 700; text-decoration: none">Go to dashboard</a>
              <button type="button" onClick="{{again}}" style="min-height: 46px; padding: 0 18px; border-radius: 11px; border: 0; background: transparent; color: #2463DB; font: 700 15px 'Plus Jakarta Sans', sans-serif; cursor: pointer">Send another parcel</button>
            </div>
          </div>
        </section>
      </sc-if>

      <sc-if value="{{flow}}" hint-placeholder-val="{{ true }}">
        <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; position: relative">

          <!-- STEP 1 -->
          <li style="display: flex; gap: 18px; padding-bottom: 22px; position: relative">
            <span aria-hidden="true" style="position: absolute; left: 17px; top: 36px; bottom: 0; width: 3px; border-radius: 2px; background: {{s1.line}}"></span>
            <span style="width: 36px; height: 36px; border-radius: 50%; background: {{s1.cBg}}; color: {{s1.cFg}}; display: grid; place-items: center; font: 700 15px 'Outfit', sans-serif; flex: none; position: relative; box-shadow: {{s1.ring}}">{{s1.num}}</span>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px">
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; min-height: 36px">
                <h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: {{s1.size}}; font-weight: 600; color: {{s1.tFg}}">Parcel details</h2>
                <span style="font-size: 14px; color: #586579">{{s1.sum}}</span>
                <sc-if value="{{s1.canEdit}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{s1.edit}}" style="border: 0; background: transparent; color: #2463DB; font: 700 14px 'Plus Jakarta Sans', sans-serif; cursor: pointer; min-height: 32px">Edit</button></sc-if>
              </div>
              <sc-if value="{{s1.open}}" hint-placeholder-val="{{ true }}">
                <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
                  <svg class="m-hide" width="200" height="170" viewBox="0 0 200 170" aria-hidden="true" style="flex: none">
                    <circle cx="100" cy="88" r="76" fill="#EAF2FE"></circle>
                    <rect x="30" y="136" width="140" height="10" rx="3" fill="#33AEEF"></rect><rect x="24" y="144" width="152" height="18" rx="5" fill="#1F2A3C"></rect><rect x="82" y="149" width="36" height="8" rx="2" fill="#8FD3F7"></rect>
                    <rect x="54" y="70" width="92" height="66" rx="4" fill="#C99A5B"></rect><rect x="54" y="70" width="92" height="15" fill="#B88648"></rect><rect x="90" y="70" width="20" height="66" fill="#E2C08A"></rect>
                    <rect x="118" y="98" width="20" height="14" rx="2" fill="#FFFFFF"></rect>
                    <g stroke="#2463DB" stroke-width="3" stroke-linecap="round"><path d="M54 56h92"></path><path d="M54 50v12M146 50v12"></path></g>
                    <rect x="78" y="34" width="44" height="18" rx="9" fill="#2463DB"></rect><text x="100" y="47" text-anchor="middle" font-family="Outfit, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">30 cm</text>
                  </svg>
                  <div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
                    <span style="font-size: 14px; color: #3E4A5C">Pick a saved parcel or add its weight and size. Saved parcels are one click next time.</span>
                    <div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between">
                      <label style="flex: 0 1 360px; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E1E7EF">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8593A8" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
                        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search parcels</span>
                        <input placeholder="Search saved parcels" style="flex: 1; min-width: 0; border: 0; background: transparent; font: 500 14px 'Plus Jakarta Sans', sans-serif">
                      </label>
                      <button type="button" class="ghost" onClick="{{toggleNewParcel}}" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #C9D6EA; background: #FFFFFF; color: #1F2A3C; font: 700 14px 'Plus Jakarta Sans', sans-serif; cursor: pointer">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2463DB" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New parcel
                      </button>
                    </div>
                    <sc-if value="{{newParcel}}" hint-placeholder-val="{{ false }}">
                      <div style="background: #FFFFFF; border: 1px solid #BFD6FB; border-radius: 14px; padding: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; align-items: end">
                        <label style="grid-column: span 2; display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #586579">Name<input aria-label="np_name" value="Large box" style="min-height: 42px; border-radius: 9px; border: 1px solid #C9D6EA; padding: 0 10px; font: 600 14px 'Plus Jakarta Sans', sans-serif"></label>
                        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #586579">Weight (kg)<input aria-label="np_kg" value="8" inputmode="decimal" style="min-height: 42px; border-radius: 9px; border: 1px solid #C9D6EA; padding: 0 10px; font: 600 14px 'Plus Jakarta Sans', sans-serif"></label>
                        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #586579">Length (cm)<input aria-label="np_l" value="60" inputmode="numeric" style="min-height: 42px; border-radius: 9px; border: 1px solid #C9D6EA; padding: 0 10px; font: 600 14px 'Plus Jakarta Sans', sans-serif"></label>
                        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #586579">Width (cm)<input aria-label="np_w" value="40" inputmode="numeric" style="min-height: 42px; border-radius: 9px; border: 1px solid #C9D6EA; padding: 0 10px; font: 600 14px 'Plus Jakarta Sans', sans-serif"></label>
                        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #586579">Height (cm)<input aria-label="np_h" value="40" inputmode="numeric" style="min-height: 42px; border-radius: 9px; border: 1px solid #C9D6EA; padding: 0 10px; font: 600 14px 'Plus Jakarta Sans', sans-serif"></label>
                        <button type="button" class="btn" onClick="{{saveParcel}}" style="min-height: 42px; border-radius: 9px; border: 0; background: #2463DB; color: #FFFFFF; font: 700 14px 'Plus Jakarta Sans', sans-serif; cursor: pointer">Save parcel</button>
                      </div>
                    </sc-if>
                    <div role="radiogroup" aria-label="Saved parcels" style="display: flex; flex-direction: column; gap: 10px">
                      <sc-for list="{{parcels}}" as="o" hint-placeholder-count="3">
                        <button type="button" role="radio" class="opt" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; border: 2px solid {{o.border}}; background: {{o.bg}}; cursor: pointer; text-align: left; font-family: 'Plus Jakarta Sans', sans-serif; color: #1F2A3C">
                          <span style="width: 20px; height: 20px; border-radius: 50%; border: 2px solid {{o.ring}}; display: grid; place-items: center; flex: none"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{o.dot}}"></span></span>
                          <span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><b style="font-size: 15px">{{o.name}}</b><span style="font-size: 13px; color: #3E4A5C"><b>{{o.kg}}</b> · {{o.dims}}</span></span>
                          <span style="font-size: 12px; font-weight: 700; color: #586579">{{o.tag}}</span>
                        </button>
                      </sc-for>
                    </div>
                  </div>
                </div>
              </sc-if>
            </div>
          </li>

          <!-- STEP 2 -->
          <li style="display: flex; gap: 18px; padding-bottom: 22px; position: relative">
            <span aria-hidden="true" style="position: absolute; left: 17px; top: 36px; bottom: 0; width: 3px; border-radius: 2px; background: {{s2.line}}"></span>
            <span style="width: 36px; height: 36px; border-radius: 50%; background: {{s2.cBg}}; color: {{s2.cFg}}; display: grid; place-items: center; font: 700 15px 'Outfit', sans-serif; flex: none; position: relative; box-shadow: {{s2.ring}}">{{s2.num}}</span>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px">
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; min-height: 36px">
                <h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: {{s2.size}}; font-weight: 600; color: {{s2.tFg}}">Collect from</h2>
                <span style="font-size: 14px; color: #586579">{{s2.sum}}</span>
                <sc-if value="{{s2.canEdit}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{s2.edit}}" style="border: 0; background: transparent; color: #2463DB; font: 700 14px 'Plus Jakarta Sans', sans-serif; cursor: pointer; min-height: 32px">Edit</button></sc-if>
              </div>
              <sc-if value="{{s2.open}}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

            </span>
            <span style="display: flex; align-items: center; gap: 8px; font-size: 14px">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8FD3F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"></path><circle cx="7" cy="18" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>{{barCourier}}
            </span>
            <span style="margin-left: auto; display: flex; gap: 8px">
              <sc-if value="{{canBack}}" hint-placeholder-val="{{ false }}">
                <button type="button" onClick="{{back}}" style="min-height: 46px; padding: 0 16px; border-radius: 11px; border: 1px solid #3B4A63; background: transparent; color: #DCE4F2; font: 700 14px 'Plus Jakarta Sans', sans-serif; cursor: pointer">Back</button>
              </sc-if>
              <button type="button" class="btn" onClick="{{next}}" aria-disabled="{{nextDisabled}}" style="min-height: 46px; padding: 0 22px; border-radius: 11px; border: 0; background: {{nextBg}}; color: {{nextFg}}; font: 700 15px 'Plus Jakarta Sans', sans-serif; cursor: {{nextCursor}}">{{nextLabel}}</button>
            </span>
          </div>
        </div>
      </sc-if>
    </main>
  </div>
</div>
</script>
</body>
</html>
