<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My account — Kargom</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icon-96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="manifest" href="/assets/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#F4F6FA}
a{color:#2463DB}a:hover{color:#1A4FB8}
.nav:hover{background:#EEF3FB}
tr.row:hover td{background:#F8FAFD}
.chip:hover{background:#2C3A50}
.btn:hover{filter:brightness(1.06)}
.ghost:hover{background:#F4F6FA}
.amt:hover{border-color:#2463DB}
.bar:hover{background:#1A4FB8}
select:focus,input:focus{outline:2px solid #33AEEF;outline-offset:-2px}
</style>
<style>.kg-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1F2A3C;color:#fff;padding:12px 18px;border-radius:12px;font:600 14px 'Nunito Sans',sans-serif;z-index:60;box-shadow:0 12px 30px rgba(8,14,28,.3)}</style>
<script type="module" src="/assets/pages/panel.js"></script>
<link rel="stylesheet" href="/assets/quickquote.css">
<link rel="stylesheet" href="/assets/recent.css">
<link rel="stylesheet" href="/assets/shop.css">
<link rel="stylesheet" href="/assets/mobile.css">
</head>
<body data-page="app">
<div id="root"></div>
<script type="text/x-template" id="tpl">
<div style="font-family: 'Nunito Sans', system-ui, sans-serif; color: #1F2A3C; background: #F4F6FA; width: 100%; min-height: 100vh; display: flex; flex-direction: column">

  <header class="m-apphead" style="background: #1F2A3C; color: #FFFFFF">
    <div style="padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px">
      <a href="/" aria-label="Kargom.co.uk home"><img src="/assets/logo-white.png" alt="Kargom.co.uk" style="height: 28px; width: auto; display: block"></a>
      <label class="m-hide" style="flex: 0 1 380px; margin-left: 24px; display: flex; align-items: center; gap: 8px; background: #2C3A50; border-radius: 10px; padding: 0 12px; min-height: 42px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9FB0C8" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search shipments</span>
        <input placeholder="Search by tracking number, postcode or name" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #FFFFFF; font: 500 14px 'Nunito Sans', sans-serif">
      </label>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 14px">
        <button type="button" class="m-hide" data-bell aria-label="{{bellLabel}}" style="position: relative; width: 42px; height: 42px; border-radius: 10px; border: 0; background: transparent; color: #DCE4F2; display: grid; place-items: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg>
          <span style="position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: #E5484D; color: #FFFFFF; font: 800 11px 'Nunito Sans', sans-serif; display: {{bellDisp}}; place-items: center; box-shadow: 0 0 0 2px #1F2A3C; box-sizing: border-box">{{bellN}}</span>
        </button>
        <button type="button" class="chip" onClick="{{openTopup}}" aria-label="Wallet balance {{balTxt}}, top up" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 6px 0 6px; border-radius: 12px; border: 1px solid #3B4A63; background: #26334A; color: #FFFFFF; font: 700 15px 'Nunito Sans', sans-serif; cursor: pointer">
          <span style="width: 32px; height: 32px; border-radius: 8px; background: #2463DB; display: grid; place-items: center">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"></rect><path d="M3 10h18M16 15h2"></path></svg>
          </span>
          <span style="font-variant-numeric: tabular-nums">{{balTxt}}</span>
          <span style="width: 28px; height: 28px; border-radius: 8px; background: #33AEEF; display: grid; place-items: center; margin-left: 2px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          </span>
        </button>
        <span style="display: flex; align-items: center; gap: 10px">
          <span style="width: 38px; height: 38px; border-radius: 50%; background: #FFFFFF; color: #1F2A3C; display: grid; place-items: center; font: 700 14px 'Nunito Sans', sans-serif">{{meIni}}</span>
          <span class="m-hide" style="display: flex; flex-direction: column; line-height: 1.25"><b style="font-size: 14px">{{meName}}</b><span style="font-size: 12px; color: #9FB0C8">{{meType}}</span></span>
          <button type="button" class="m-hide" onClick="{{signOut}}" style="margin-left: 6px; min-height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid #3B4A63; background: transparent; color: #DCE4F2; font: 700 13px 'Nunito Sans', sans-serif; cursor: pointer">Sign out</button>
        </span>
      </div>
    </div>
  </header><div style="flex: 1; display: flex; flex-wrap: wrap; align-items: stretch">
    <aside aria-label="Account menu" class="m-side" style="flex: 1 1 230px; max-width: 250px; background: #FFFFFF; border-right: 1px solid #E1E7EF; padding: 20px 14px; display: flex; flex-direction: column; gap: 6px; box-sizing: border-box">
      <a href="/app/send" class="btn" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; border-radius: 11px; background: #2463DB; color: #FFFFFF; font-weight: 700; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Send a parcel
      </a>
      <a href="/app/quote" class="m-quote" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 11px; border: 1px solid #C9D6EA; background: #FFFFFF; color: #1F2A3C; font-weight: 700; font-size: 14px; text-decoration: none; margin-top: 4px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"></path><circle cx="7" cy="17.5" r="1.8"></circle><circle cx="17" cy="17.5" r="1.8"></circle></svg>Get a quote
      </a>
      <span style="height: 12px"></span>
      <nav style="display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{nav}}" as="n" hint-placeholder-count="8">
          <button type="button" class="nav" onClick="{{n.pick}}" aria-current="{{n.cur}}" style="display: flex; align-items: center; gap: 11px; min-height: 42px; padding: 0 12px; border: 0; border-radius: 10px; background: {{n.bg}}; color: {{n.fg}}; font: 600 14px 'Nunito Sans', sans-serif; cursor: pointer; text-align: left">
            <span style="width: 8px; height: 8px; border-radius: 50%; background: {{n.dot}}"></span>
            <span style="flex: 1">{{n.label}}</span>
            <span style="font-size: 11px; font-weight: 800; color: {{n.badgeFg}}; background: {{n.badgeBg}}; min-width: 20px; padding: 2px 6px; border-radius: 999px; text-align: center; box-sizing: border-box">{{n.badge}}</span>
          </button>
        </sc-for>
      </nav><div style="margin-top: auto; background: #EAF2FE; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
        <b style="font-size: 14px">Need a hand?</b>
        <span style="font-size: 13px; color: #3E4A5C; line-height: 1.5">Our UK team answers in minutes, Mon to Sat.</span>
        <button type="button" onClick="{{goHelp}}" style="align-self: flex-start; border: 0; padding: 0; background: transparent; color: #2463DB; font: 700 14px 'Nunito Sans', sans-serif; cursor: pointer; min-height: 32px">Open a request</button>
      </div>
      <button type="button" class="m-signout" onClick="{{signOut}}" style="margin-top: 10px; display: flex; align-items: center; gap: 11px; min-height: 42px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: #B42318; font: 600 14px 'Nunito Sans', sans-serif; cursor: pointer; text-align: left">Sign out</button>
      
    </aside>

    <main class="m-main" style="flex: 999 1 640px; min-width: 0; padding: 28px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box">

      <sc-if value="{{isDash}}" hint-placeholder-val="{{ true }}">
        <div class="m-d1" style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
          <div>
            <h1 style="margin: 0; font-family: 'Nunito Sans', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.015em">{{greeting}}</h1>
            <span style="font-size: 14px; color: #586579">{{monthTxt}}</span>
          </div>
          <span style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E1E7EF; font-size: 14px; font-weight: 600">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#586579" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>{{monthName}}
          </span>
        </div>

        <div class="m-d2" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px">
          <section style="position: relative; overflow: hidden; border-radius: 18px; padding: 22px; color: #FFFFFF; background: linear-gradient(110deg, #3D6DEB 0%, #2A4FC8 55%, #1D3593 100%); display: flex; flex-direction: column; gap: 10px; min-height: 230px; box-sizing: border-box">
            <svg width="220" height="220" viewBox="0 0 220 220" aria-hidden="true" style="position: absolute; right: -50px; top: -40px; opacity: .14"><circle cx="110" cy="110" r="100" fill="none" stroke="#FFFFFF" stroke-width="28"></circle></svg>
            <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
              <span style="font-size: 14px; font-weight: 600; color: #DCE4F2">Wallet balance</span>
              <span style="font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: {{lowBg}}; color: {{lowFg}}">{{lowTxt}}</span>
            </span>
            <span style="font-family: 'Nunito Sans', sans-serif; font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums">{{balTxt}}</span>
            <span style="font-size: 14px; color: #DCE4F2">Enough for about <b style="color: #FFFFFF">{{parcels}} parcels</b> at {{avgLabelTxt}}</span>
            <div style="display: flex; gap: 8px; margin-top: auto">
              <button type="button" class="btn" onClick="{{openTopup}}" style="flex: 1; min-height: 44px; border-radius: 10px; border: 0; background: #FFFFFF; color: #1F2A3C; font: 700 14px 'Nunito Sans', sans-serif; cursor: pointer">Top up</button>
              <button type="button" onClick="{{goWallet}}" style="flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid rgba(255,255,255,.45); background: transparent; color: #FFFFFF; font: 700 14px 'Nunito Sans', sans-serif; cursor: pointer">Activity</button>
            </div>
            <span style="font-size: 12px; color: #BFD6FB">{{autoLine}}</span>
          </section>

          <section class="qq">
            <div class="qq-art" aria-hidden="true"><img src="/assets/quote-cat.webp" alt="" width="640" height="566"></div>
            <div class="qq-head">
              <b>Quick quote</b>
              <span>Compare courier prices in seconds</span>
            </div>
            <div class="qq-row">
              <label class="qq-f"><span>From</span>
                <span class="qq-sel"><img src="{{qFromFlag}}" alt="" class="qq-flag"><select aria-label="Quick quote from" onChange="{{setQFrom}}"><option value="United Kingdom">UK</option><option value="Northern Ireland">N. Ireland</option><option value="Channel Islands">Channel Isl.</option></select><svg class="qq-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F2A3C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
              </label>
              <label class="qq-f"><span>To</span>
                <span class="qq-sel"><img src="{{qToFlag}}" alt="" class="qq-flag"><select aria-label="Quick quote to" onChange="{{setQTo}}"><option value="United Kingdom">UK</option><option value="United States">USA</option><option>Germany</option><option>France</option><option>Ireland</option></select><svg class="qq-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F2A3C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
              </label>
            </div>
            <label class="qq-kg">
              <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><path d="M14 11a6 6 0 0 1 12 0" fill="none" stroke="#2463DB" stroke-width="3.4" stroke-linecap="round"></path><path d="M9.5 12h21a3 3 0 0 1 2.9 2.3l3.4 17.5A3 3 0 0 1 33.9 35H6.1a3 3 0 0 1-2.9-3.2l3.4-17.5A3 3 0 0 1 9.5 12z" fill="#2463DB"></path><text x="20" y="29" text-anchor="middle" font-family="Nunito Sans, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">KG</text></svg>
              <span>Weight</span>
              <input value="2" inputmode="decimal" aria-label="Parcel weight in kg">
              <i>kg</i>
            </label>
            <a href="/quotes" onClick="{{quickQuote}}" class="btn qq-go">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L20 20"></path></svg>
              <span>Get quotes</span>
              <em><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></em>
            </a>
          </section>

          <section style="background: #FFFFFF; border: 1px solid #E1E7EF; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
            <b style="font-size: 16px">This month</b>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px">
              <sc-for list="{{month}}" as="m" hint-placeholder-count="4">
                <div style="display: flex; flex-direction: column; gap: 2px">
                  <span style="font-size: 13px; color: #586579; font-weight: 600">{{m.label}}</span>
                  <span style="font-family: 'Nunito Sans', sans-serif; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{m.color}}">{{m.value}}</span>
                </div>
              </sc-for>
            </div>
            <span style="margin-top: auto; font-size: 12px; color: #586579; line-height: 1.5; border-top: 1px solid #EEF2F7; padding-top: 10px">Saved = what you paid vs. the most expensive quote for the same parcel.</span>
          </section>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px">
          <sc-for list="{{tiles}}" as="t" hint-placeholder-count="5">
            <button type="button" onClick="{{t.pick}}" style="display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 14px; border: 1px solid {{t.border}}; background: #FFFFFF; cursor: pointer; text-align: left; font-family: 'Nunito Sans', sans-serif; color: #1F2A3C">
              <span style="width: 42px; height: 42px; border-radius: 11px; background: {{t.bg}}; display: grid; place-items: center; flex: none"><span style="width: 12px; height: 12px; border-radius: 50%; background: {{t.fg}}"></span></span>
              <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #586579; font-weight: 600">{{t.label}}</span><b style="font-family: 'Nunito Sans', sans-serif; font-size: 24px; font-variant-numeric: tabular-nums">{{t.n}}</b></span>
            </button>
          </sc-for>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch">
          <section style="flex: 999 1 520px; min-width: 0; background: #FFFFFF; border: 1px solid #E1E7EF; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
            <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
              <h2 style="margin: 0; font-size: 18px">Parcels sent</h2>
              <span style="font-size: 13px; color: #586579">{{barsNote}}</span>
            </div>
            <div role="img" aria-label="Bar chart of parcels sent per day in October, between 0 and 6 a day" style="display: flex; align-items: flex-end; gap: 4px; height: 170px; border-bottom: 1px solid #E1E7EF; padding-bottom: 2px">
              <sc-for list="{{bars}}" as="b" hint-placeholder-count="27">
                <span style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%">
                  <span class="bar" title="{{b.tip}}" style="width: 100%; max-width: 18px; height: {{b.h}}; min-height: 3px; border-radius: 4px 4px 0 0; background: {{b.c}}"></span>
                </span>
              </sc-for>
            </div>
            <div style="display: flex; gap: 4px; margin-top: -10px">
              <sc-for list="{{bars}}" as="b" hint-placeholder-count="27">
                <span style="flex: 1; text-align: center; font-size: 11px; color: #8593A8; font-variant-numeric: tabular-nums">{{b.lab}}</span>
              </sc-for>
            </div>
          </section>

          <section style="flex: 1 1 320px; background: #FFFFFF; border: 1px solid #E1E7EF; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
            <h2 style="margin: 0; font-size: 18px">Needs your attention</h2>
            <sc-for list="{{todo}}" as="d" hint-placeholder-count="4">
              <div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 12px; background: {{d.bg}}">
                <span style="width: 9px; height: 9px; border-radius: 50%; background: {{d.dot}}; margin-top: 6px; flex: none"></span>
                <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 14px">{{d.t}}</b><span style="font-size: 13px; color: #3E4A5C; line-height: 1.45">{{d.s}}</span></span>
                <a href="#" onClick="{{d.go}}" style="font-size: 13px; font-weight: 700; text-decoration: none; white-space: nowrap; margin-top: 1px">{{d.a}}</a>
              </div>
            </sc-for>
          </section>
        </div>

        <section class="m-d3" style="background: #FFFFFF; border: 1px solid #E1E7EF; border-radius: 18px; overflow: hidden">
          <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 20px 0">
            <h2 style="margin: 0; font-size: 18px">Recent shipments</h2>
            <a href="#" onClick="{{goShip}}" style="font-size: 14px; font-weight: 600; text-decoration: none">View all</a>
          </div>
          <div role="tablist" aria-label="Shipment status" style="display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 20px">
            <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
              <button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font: 600 13px 'Nunito Sans', sans-serif; cursor: pointer">{{t.label}} · {{t.n}}</button>
            </sc-for>
          </div>
          <div class="rs-list">
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
              <article class="rs-card">
                <span class="rs-ico">
                  <sc-if value="{{r.hasLogo}}" hint-placeholder-val="{{ true }}"><img src="{{r.logo}}" alt="{{r.carrier}}"></sc-if>
                  <sc-if value="{{r.icoShip}}" hint-placeholder-val="{{ false }}"><svg width="30" height="30" viewBox="0 0 24 24" fill="#2463DB" aria-hidden="true"><path d="M11 2h2v2.2h3.5v4.3l2.8.9-1.1 3.6H5.8L4.7 9.4l2.8-.9V4.2H11zm-1.5 4.2v1.8L12 7.2l2.5.8V6.2z"></path><path d="M3 14.5h18l-2 4.4c-.9.4-1.8.6-2.7.6-1.6 0-2.8-.6-4.3-.6s-2.7.6-4.3.6c-.9 0-1.8-.2-2.7-.6z"></path><path d="M2.5 21.5c1.6 0 2.4-.7 4.2-.7s2.6.7 4.3.7 2.5-.7 4.3-.7 2.6.7 4.2.7" stroke="#2463DB" stroke-width="1.4" fill="none" stroke-linecap="round"></path></svg></sc-if>
                  <sc-if value="{{r.icoTruck}}" hint-placeholder-val="{{ false }}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2463DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6h12v10H2zM14 9h4l4 4v3h-8z"></path><circle cx="6.5" cy="17.5" r="2" fill="#FFFFFF"></circle><circle cx="17.5" cy="17.5" r="2" fill="#FFFFFF"></circle></svg></sc-if>
                  <sc-if value="{{r.icoWh}}" hint-placeholder-val="{{ false }}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2463DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V8l9-5 9 5v13"></path><path d="M7 21v-8h10v8"></path><path d="M7 17h10"></path></svg></sc-if>
                </span>
                <div class="rs-body">
                  <div class="rs-top">
                    <b class="rs-to" title="{{r.toFull}}">{{r.cTo}}</b>
                    <span class="rs-price">{{r.cPrice}}</span>

                <span style="display: grid; place-items: center"><button type="button" role="switch" aria-checked="{{n.sOn}}" aria-label="{{n.label}} by SMS" onClick="{{n.sToggle}}" style="width: 44px; height: 26px; border-radius: 999px; border: 0; background: {{n.sBg}}; position: relative; cursor: pointer"><span style="position: absolute; top: 3px; left: {{n.sX}}; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.25)"></span></button></span>

        <sc-if value="{{setSec}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; max-width: 1000px">
            <section style="flex: 1 1 320px; background: #FFFFFF; border: 1px solid #E1E7EF; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
              <b style="font-size: 16px">Password</b>
              <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #586579">Current password<input type="password" autocomplete="current-password" style="min-height: 44px; border-radius: 10px; border: 1px solid #C9D6EA; padding: 0 12px"></label>
              <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #586579">New password<input type="password" autocomplete="new-password" style="min-height: 44px; border-radius: 10px; border: 1px solid #C9D6EA; padding: 0 12px"></label>
              <button type="button" class="btn" style="align-self: flex-start; min-height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #2463DB; color: #FFFFFF; font: 700 14px 'Nunito Sans', sans-serif; cursor: pointer">Update password</button>
            </section>
            <section style="flex: 1 1 320px; background: #FFFFFF; border: 1px solid #E1E7EF; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
                <span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 16px">Two-step sign-in</b><span style="font-size: 13px; color: #586579">A code from your phone each time you sign in.</span></span>
                <button type="button" role="switch" aria-checked="{{tfaOn}}" aria-label="Two-step sign-in" onClick="{{toggleTfa}}" style="width: 52px; height: 30px; border-radius: 999px; border: 0; background: {{tfaBg}}; position: relative; cursor: pointer; flex: none"><span style="position: absolute; top: 3px; left: {{tfaX}}; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.25)"></span></button>
              </div>
              <b style="font-size: 14px; border-top: 1px solid #EEF2F7; padding-top: 14px">Signed-in devices</b>
              <sc-for list="{{sessions}}" as="s" hint-placeholder-count="2">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px">
                  <span style="display: flex; flex-direction: column; gap: 2px"><b>{{s.d}}</b><span style="font-size: 12px; color: #586579">{{s.w}}</span></span>
                  <span style="font-size: 13px; font-weight: 700; color: {{s.c}}">{{s.a}}</span>
                </div>
              </sc-for>
            </section>
          </div>
        </sc-if>

        <sc-if value="{{setTeam}}" hint-placeholder-val="{{ false }}">
          <section style="background: #FFFFFF; border: 1px solid #E1E7EF; border-radius: 18px; overflow: hidden; max-width: 860px">
            <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 20px">
              <span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 16px">Team members</b><span style="font-size: 13px; color: #586579">Staff can book labels from the shared wallet. Only admins can top up.</span></span>
              <button type="button" class="btn" style="min-height: 42px; padding: 0 16px; border-radius: 10px; border: 0; background: #2463DB; color: #FFFFFF; font: 700 14px 'Nunito Sans', sans-serif; cursor: pointer">+ Invite member</button>
            </div>
            <sc-for list="{{team}}" as="m" hint-placeholder-count="3">
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 20px; border-top: 1px solid #EEF2F7">
                <span style="width: 38px; height: 38px; border-radius: 50%; background: {{m.color}}; color: #FFFFFF; display: grid; place-items: center; font: 700 14px 'Nunito Sans', sans-serif">{{m.ini}}</span>
                <span style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 14px">{{m.name}}</b><span style="font-size: 12px; color: #586579">{{m.email}}</span></span>
                <span style="font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: {{m.rBg}}; color: {{m.rFg}}">{{m.role}}</span>
                <span style="font-size: 13px; color: #586579; min-width: 110px; text-align: right">{{m.last}}</span>
              </div>
            </sc-for>
          </section>
        </sc-if>
      </sc-if>

      <sc-if value="{{isHelp}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
          <div>
            <h1 style="margin: 0; font-family: 'Nunito Sans', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.015em">Help</h1>
            <span style="font-size: 14px; color: #586579">Our UK team usually replies within 1 hour, Monday to Saturday, 8am to 8pm.</span>
          </div>
          <button type="button" class="btn" onClick="{{toggleNew}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 10px; border: 0; background: #2463DB; color: #FFFFFF; font: 700 14px 'Nunito Sans', sans-serif; cursor: pointer">{{newBtn}}</button>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
          <sc-for list="{{faqs}}" as="q" hint-placeholder-count="4">
            <a href="#" style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E1E7EF; text-decoration: none; color: #1F2A3C">
              <span style="width: 36px; height: 36px; border-radius: 10px; background: #EAF2FE; color: #2463DB; display: grid; place-items: center; font: 700 16px 'Nunito Sans', sans-serif; flex: none">{{q.icon}}</span>
              <span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 14px">{{q.t}}</b><span style="font-size: 13px; color: #586579; line-height: 1.45">{{q.s}}</span></span>
            </a>
          </sc-for>
        </div>

        <sc-if value="{{newOpen}}" hint-placeholder-val="{{ false }}">
          <section style="background: #FFFFFF; border: 2px solid #BFD6FB; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 14px">

            <div style="display: flex; flex-direction: column; gap: 6px">

              <div role="radiogroup" aria-label="Topic" style="display: flex; flex-wrap: wrap; gap: 6px">
                <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
                  <button type="button" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: 600 13px 'Nunito Sans', sans-serif; cursor: pointer">{{c.label}}</button>
                </sc-for>
              </div>
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
              <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #586579">Related shipment
                <select name="t_ship" style="min-height: 44px; border-radius: 10px; border: 1px solid #C9D6EA; padding: 0 10px; font: 600 14px 'Nunito Sans', sans-serif; color: #1F2A3C; background: #FFFFFF"><sc-for list="{{shipOptions}}" as="o"><option value="{{o.id}}">{{o.label}}</option></sc-for><option value="">Not about a shipment</option></select>
              </label>
              <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #586579">Subject
                <input name="t_subject" placeholder="A few words, e.g. Parcel arrived damaged" style="min-height: 44px; border-radius: 10px; border: 1px solid #C9D6EA; padding: 0 12px; font: 600 14px 'Nunito Sans', sans-serif; color: #1F2A3C">
              </label>
            </div>
            <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #586579">Tell us what happened
              <textarea name="t_body" rows="4" placeholder="The more detail, the faster we can help." style="border-radius: 10px; border: 1px solid #C9D6EA; padding: 10px 12px; font: 500 14px 'Nunito Sans', sans-serif; color: #1F2A3C; resize: vertical"></textarea>
            </label>
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
              <button type="button" class="ghost" style="display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 14px; border-radius: 10px; border: 1px dashed #9FB0C8; background: #FFFFFF; color: #1F2A3C; font: 600 13px 'Nunito Sans', sans-serif; cursor: pointer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12l-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 8"></path></svg>Add photos or files
              </button>
              <span style="font-size: 12px; color: #586579">{{catHint}}</span>
              <button type="button" class="btn" onClick="{{submitTicket}}" style="margin-left: auto; min-height: 44px; padding: 0 20px; border-radius: 10px; border: 0; background: #2463DB; color: #FFFFFF; font: 700 14px 'Nunito Sans', sans-serif; cursor: pointer">Send request</button>
            </div>
          </section>
        </sc-if>

        <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch">
          <section style="flex: 1 1 300px; max-width: 380px; background: #FFFFFF; border: 1px solid #E1E7EF; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 8px; align-self: flex-start">
            <b style="font-size: 15px; padding: 4px 6px 6px">Your requests</b>
            <sc-for list="{{tickets}}" as="t" hint-placeholder-count="3">
              <button type="button" onClick="{{t.pick}}" aria-current="{{t.cur}}" style="display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 12px; border: 2px solid {{t.border}}; background: {{t.bg}}; cursor: pointer; text-align: left; font-family: 'Nunito Sans', sans-serif; color: #1F2A3C">
                <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
                  <span style="font-size: 12px; font-family: ui-monospace, Menlo, monospace; color: #586579">{{t.no}}</span>
                  <span style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: {{t.sBg}}; color: {{t.sFg}}">{{t.status}}</span>
                </span>
                <b style="font-size: 14px; line-height: 1.35">{{t.subject}}</b>
                <span style="font-size: 12px; color: #586579">{{t.meta}}</span>
              </button>
            </sc-for>
          </section>

          <section style="flex: 999 1 460px; min-width: 0; background: #FFFFFF; border: 1px solid #E1E7EF; border-radius: 18px; display: flex; flex-direction: column; min-height: 520px">
            <div style="padding: 18px 20px; border-bottom: 1px solid #EEF2F7; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px">
              <span style="display: flex; flex-direction: column; gap: 3px"><b style="font-family: 'Nunito Sans', sans-serif; font-size: 20px">{{cur.subject}}</b><span style="font-size: 13px; color: #586579">{{cur.no}} · {{cur.cat}} · {{cur.ship}}</span></span>
              <span style="font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: {{cur.sBg}}; color: {{cur.sFg}}">{{cur.status}}</span>
            </div>
            <div style="flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 14px; background: #FAFBFD">
              <sc-for list="{{msgs}}" as="m" hint-placeholder-count="3">
                <div style="display: flex; flex-direction: column; gap: 4px; align-items: {{m.align}}; max-width: 100%">
                  <span style="font-size: 12px; color: #586579"><b style="color: #1F2A3C">{{m.who}}</b> · {{m.time}}</span>
                  <div style="max-width: 560px; padding: 12px 14px; border-radius: {{m.radius}}; background: {{m.bg}}; color: {{m.fg}}; font-size: 14px; line-height: 1.55; border: 1px solid {{m.border}}">{{m.text}}</div>
                  <sc-if value="{{m.hasFile}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 8px; background: #EEF2F7; color: #3E4A5C">📎 {{m.file}}</span></sc-if>
                </div>
              </sc-for>
            </div>
            <sc-if value="{{canReply}}" hint-placeholder-val="{{ true }}">
              <div style="padding: 14px 20px; border-top: 1px solid #EEF2F7; display: flex; flex-direction: column; gap: 10px">
                <label style="display: flex; flex-direction: column; gap: 4px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Your reply</span>
                  <textarea rows="3" value="{{draft}}" onInput="{{setDraft}}" placeholder="Write a reply…" style="border-radius: 10px; border: 1px solid #C9D6EA; padding: 10px 12px; font: 500 14px 'Nunito Sans', sans-serif; color: #1F2A3C; resize: vertical"></textarea>
                </label>
                <div style="display: flex; align-items: center; gap: 10px">
                  <button type="button" class="ghost" style="min-height: 40px; padding: 0 12px; border-radius: 9px; border: 1px solid #C9D6EA; background: #FFFFFF; color: #1F2A3C; font: 600 13px 'Nunito Sans', sans-serif; cursor: pointer">📎 Attach</button>
                  <button type="button" class="ghost" onClick="{{closeTicket}}" style="min-height: 40px; padding: 0 12px; border-radius: 9px; border: 0; background: transparent; color: #586579; font: 600 13px 'Nunito Sans', sans-serif; cursor: pointer">Mark as solved</button>
                  <button type="button" class="btn" onClick="{{sendReply}}" style="margin-left: auto; min-height: 42px; padding: 0 18px; border-radius: 10px; border: 0; background: #2463DB; color: #FFFFFF; font: 700 14px 'Nunito Sans', sans-serif; cursor: pointer">Send</button>
                </div>
              </div>
            </sc-if>
            <sc-if value="{{isClosed}}" hint-placeholder-val="{{ false }}">
              <div style="padding: 16px 20px; border-top: 1px solid #EEF2F7; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; color: #3E4A5C">
                This request is solved. Not sorted after all?
                <button type="button" class="ghost" onClick="{{reopen}}" style="min-height: 40px; padding: 0 14px; border-radius: 9px; border: 1px solid #C9D6EA; background: #FFFFFF; color: #1F2A3C; font: 700 13px 'Nunito Sans', sans-serif; cursor: pointer">Reopen</button>
              </div>
            </sc-if>
          </section>
        </div>
      </sc-if>
    </main>
  </div>

  

  <sc-if value="{{topup}}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-modal="true" aria-label="Top up wallet" style="position: fixed; inset: 0; background: rgba(8,14,28,.6); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 10">
      <div style="width: 100%; max-width: 460px; background: #FFFFFF; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 24px 60px rgba(8,14,28,.35)">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <span style="display: flex; flex-direction: column; gap: 2px"><b style="font-family: 'Nunito Sans', sans-serif; font-size: 22px">Top up wallet</b><span style="font-size: 13px; color: #586579">Current balance {{balTxt}}</span></span>
          <button type="button" onClick="{{closeTopup}}" aria-label="Close" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: #F4F6FA; color: #1F2A3C; display: grid; place-items: center; cursor: pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>
        <div role="radiogroup" aria-label="Amount" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{amounts}}" as="a" hint-placeholder-count="6">
            <button type="button" role="radio" class="amt" aria-checked="{{a.on}}" onClick="{{a.pick}}" style="min-height: 58px; border-radius: 12px; border: 2px solid {{a.border}}; background: {{a.bg}}; color: #1F2A3C; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px">
              <b style="font: 700 19px 'Nunito Sans', sans-serif">{{a.label}}</b>
              <span style="font: 600 11px 'Nunito Sans', sans-serif; color: #586579">{{a.note}}</span>
            </button>
          </sc-for>
        </div>
        <div role="radiogroup" aria-label="Payment method" style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 12px; font-weight: 700; color: #586579; text-transform: uppercase; letter-spacing: .05em">Pay with</span>
          <sc-for list="{{methods}}" as="m" hint-placeholder-count="3">
            <button type="button" role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 14px; border-radius: 12px; border: 2px solid {{m.border}}; background: #FFFFFF; cursor: pointer; font: 600 14px 'Nunito Sans', sans-serif; color: #1F2A3C; text-align: left">
              <span style="width: 18px; height: 18px; border-radius: 50%; border: 2px solid {{m.ring}}; display: grid; place-items: center; flex: none"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{m.dot}}"></span></span>
              <span style="flex: 1">{{m.label}}</span>
              <span style="font-size: 12px; color: #586579">{{m.note}}</span>
            </button>
          </sc-for>
        </div>
        <div style="background: #F4F6FA; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px">
          <span style="display: flex; justify-content: space-between"><span>New balance</span><b style="font-variant-numeric: tabular-nums">{{newBal}}</b></span>
          <span style="font-size: 12px; color: #586579; line-height: 1.5">VAT is charged on each label you book, not on the top-up.</span>
        </div>
        <button type="button" class="btn" onClick="{{pay}}" style="min-height: 52px; border-radius: 12px; border: 0; background: #2463DB; color: #FFFFFF; font: 700 16px 'Nunito Sans', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Pay {{amtTxt}}
        </button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{adjOpen}}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-modal="true" aria-label="Weight adjustment" style="position: fixed; inset: 0; background: rgba(8,14,28,.6); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 10">
      <div style="width: 100%; max-width: 500px; background: #FFFFFF; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 24px 60px rgba(8,14,28,.35)">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
          <span style="display: flex; gap: 12px; align-items: flex-start">
            <span style="width: 40px; height: 40px; border-radius: 50%; background: {{mDot}}; color: #FFFFFF; display: grid; place-items: center; font: 800 20px 'Nunito Sans', sans-serif; flex: none">i</span>
            <span style="display: flex; flex-direction: column; gap: 2px"><b style="font-family: 'Nunito Sans', sans-serif; font-size: 21px">{{aTitle}}</b><span style="font-size: 13px; color: #586579">{{aSvc}} · <span style="font-family: ui-monospace, Menlo, monospace">{{aNo}}</span> · {{aWhen}}</span></span>
          </span>
          <button type="button" onClick="{{closeAdj}}" aria-label="Close" style="width: 38px; height: 38px; border-radius: 50%; border: 0; background: #F4F6FA; color: #1F2A3C; display: grid; place-items: center; cursor: pointer; flex: none">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>
        <div style="display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center">
          <div style="border: 1px solid #E1E7EF; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 700; color: #586579; text-transform: uppercase; letter-spacing: .04em">You entered</span><b style="font-family: 'Nunito Sans', sans-serif; font-size: 26px">{{aKgFrom}}</b><span style="font-size: 13px; color: #586579">{{aDimFrom}}</span></div>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{mFg}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          <div style="border: 2px solid {{mBorder}}; background: {{mBg}}; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 700; color: {{mFg}}; text-transform: uppercase; letter-spacing: .04em">Courier measured</span><b style="font-family: 'Nunito Sans', sans-serif; font-size: 26px; color: {{mFg}}">{{aKgTo}}</b><span style="font-size: 13px; color: #3E4A5C">{{aDimTo}}</span></div>
        </div>
        <sc-if value="{{aPaid}}" hint-placeholder-val="{{ true }}">
          <div style="background: #F4F6FA; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px">
            <span style="display: flex; justify-content: space-between"><span>Price difference charged</span><b style="font-variant-numeric: tabular-nums">{{aExtra}}</b></span>
            <span style="display: flex; justify-content: space-between"><span>Taken from</span><b>{{aVia}}</b></span>
          </div>
        </sc-if>
        <sc-if value="{{aFree}}" hint-placeholder-val="{{ false }}">
          <div style="background: #FFF8EC; border: 1px solid #F5D9A8; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: #7A4A00">
            <b>No extra charge was taken</b>
            <span>{{aBand}} Nothing more to pay.</span>
          </div>
        </sc-if>
        <span style="font-size: 13px; color: #3E4A5C; line-height: 1.55">Couriers check every parcel in their depot. Prices depend on weight and size, so when a parcel is heavier or bigger than booked, the courier bills the difference. Weigh and measure before booking to avoid this.</span>
        <div style="display: flex; gap: 8px; justify-content: flex-end">
          <sc-if value="{{aPaid}}" hint-placeholder-val="{{ true }}"><button type="button" class="ghost" onClick="{{dispute}}" style="min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #C9D6EA; background: #FFFFFF; color: #1F2A3C; font: 700 14px 'Nunito Sans', sans-serif; cursor: pointer">Dispute this</button></sc-if>
          <button type="button" class="btn" onClick="{{closeAdj}}" style="min-height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #2463DB; color: #FFFFFF; font: 700 14px 'Nunito Sans', sans-serif; cursor: pointer">OK, got it</button>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #1F2A3C; color: #FFFFFF; border-radius: 12px; padding: 12px 18px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; box-shadow: 0 12px 30px rgba(8,14,28,.3); z-index: 11">
      <span style="width: 22px; height: 22px; border-radius: 50%; background: #16A34A; display: grid; place-items: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
      {{toastTxt}}
      <button type="button" onClick="{{hideToast}}" aria-label="Dismiss" style="margin-left: 6px; border: 0; background: transparent; color: #9FB0C8; cursor: pointer; font: 700 13px 'Nunito Sans', sans-serif; min-height: 32px">OK</button>
    </div>
  </sc-if>
</div>
</script>
</body>
</html>
